meta:
  description: Verified-good VAPIX baseline for the legacy-smb fleet (AXIS M3005 / P1204 / M2014-E).
  generated: '2026-09-17'
  firmware: 5.51.7.4
  derived_from: parameters on which 192.168.1.79 (reference) and 192.168.1.60 (converged 2026-09-15) agree
  param_count: 561
  IMPORTANT: Reference only. `cctv apply` does NOT read this file - config.py ignores unknown keys, so
    pasting it into cameras.yaml would look enforced while doing nothing.
  secrets: 2 credential value(s) redacted; real values live in cameras.yaml (gitignored).
critical_settings:
  root.Image.TriggerDataEnabled:
    value: 'no'
    why: Keeps /usr/sbin/triggerd stopped. When yes, triggerd competes for CPU with the legacy VMD .eap
      app on ARMv6 and causes 30-110 min blind windows with no logged error. This was the root cause of
      the missed events on .60 (fixed 2026-09-15).
  root.Image.I0.MPEG.UserDataEnabled:
    value: 'no'
    why: Same daemon family - stops per-frame user-data injection into the 1080p25 H.264 stream.
  root.Motion:
    value: <group must be EMPTY - no MX windows>
    why: The legacy .eap keeps its own polygon config in vaconfig.cgi and ignores root.Motion. A window
      here only keeps triggerd alive. reconciler._ensure_motion_window skips empty groups, so this survives
      cctv apply.
  root.Time.POSIXTimeZone:
    value: MSK-3
    why: Moscow, no DST.
  root.Time.DST.Enabled:
    value: 'no'
    why: MSK-3 has no DST rule; leaving this on is inconsistent across the fleet.
  root.RemoteService.Enabled:
    value: 'no'
    why: AXIS O3C one-click remote service not used on this fleet.
  root.Storage.S1.CleanupMaxAge:
    value: '33'
    why: 'NOTE: cameras.yaml sets recording_retention_days: 0 (unlimited) but both cameras run 33. cctv
      apply is not converging this - known drift, unresolved.'
expected_non_param_state:
  applications:
  - Name: VideoMotionDetection
    NiceName: AXIS Video Motion Detection
    Version: '2.2'
    Status: Running
  action_rules:
  - name: cctv_motion_record
    enabled: true
    topic: tns1:RuleEngine/tnsaxis:VideoMotionDetection/motion//.
    note: exactly one rule - no ACC_LED_* or other leftovers
  action_configurations:
  - name: cctv_motion_record
    template: com.axis.action.unlimited.recording.storage
    pre_duration: 5000
    post_duration: 2000
    storage_id: NetworkShare
    note: matches cameras.yaml pre_trigger_time 5 / post_trigger_time 2
  recipients: none - an empty recipients dir; a networkshare recipient implies a stray duplicate share
  network_shares: exactly ONE root.NetworkShare.Nx entry; more than one means duplicate CIFS mounts
  cifs_mounts: exactly 2 in /proc/mounts (NetworkShareN + NetworkShare); a third means a duplicate share
  processes: /usr/sbin/triggerd MUST NOT be running
